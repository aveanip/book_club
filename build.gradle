plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
    id 'io.freefair.lombok' version "9.2.0"
}

repositories {
    mavenCentral()
}

// Настройки Allure
allure {
    report {
        version.set("2.29.0") // Привели версию отчета к версии зависимостей для стабильности
    }
    adapter {
        aspectjWeaver.set(true) // Обработка аннотации @Step
        frameworks {
            junit5 {
                adapterVersion.set("2.29.0") // Версия интеграции фреймворка и Allure
            }
        }
    }
}

dependencies {
    // Rest Assured
    testImplementation 'io.rest-assured:rest-assured:6.0.0'
    testImplementation 'io.rest-assured:json-schema-validator:6.0.0' // Убрали дубликат и переменную

    // Allure (ВСЕ версии теперь одинаковые: 2.29.0)
    testImplementation 'io.qameta.allure:allure-rest-assured:2.29.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.29.0'

    // Selenide (Оставили только одну, самую свежую версию)
    testImplementation 'com.codeborne:selenide:7.16.1'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2' // 5.14.2 еще не существует, стабильная 5.10.2
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Утилиты
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
    testImplementation 'org.assertj:assertj-core:3.25.3' // Стабильная версия

    // Логирование
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}